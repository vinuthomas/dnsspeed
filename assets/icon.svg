<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#0f172a" />
  
  <!-- Outer glowing ring -->
  <circle cx="512" cy="512" r="340" stroke="url(#paint0_linear)" stroke-width="40" stroke-linecap="round" stroke-dasharray="80 40" opacity="0.8"/>
  <circle cx="512" cy="512" r="420" stroke="url(#paint1_linear)" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

  <!-- Inner core -->
  <circle cx="512" cy="512" r="260" fill="url(#paint2_linear)" opacity="0.2"/>
  
  <!-- Lightning Bolt -->
  <path d="M570 300L350 560H510L460 760L700 480H530L570 300Z" fill="url(#paint3_linear)" filter="drop-shadow(0px 8px 16px rgba(52, 211, 153, 0.4))"/>

  <defs>
    <!-- Gradients matching Tailwind colors -->
    <linearGradient id="paint0_linear" x1="172" y1="172" x2="852" y2="852" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" /> <!-- blue-500 -->
      <stop offset="1" stop-color="#10b981" /> <!-- emerald-500 -->
    </linearGradient>
    <linearGradient id="paint1_linear" x1="852" y1="172" x2="172" y2="852" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#14b8a6" /> <!-- teal-500 -->
    </linearGradient>
    <linearGradient id="paint2_linear" x1="252" y1="252" x2="772" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa" /> <!-- blue-400 -->
      <stop offset="1" stop-color="#34d399" /> <!-- emerald-400 -->
    </linearGradient>
    <linearGradient id="paint3_linear" x1="350" y1="300" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" /> <!-- emerald-400 -->
      <stop offset="0.5" stop-color="#3b82f6" /> <!-- blue-500 -->
      <stop offset="1" stop-color="#14b8a6" /> <!-- teal-500 -->
    </linearGradient>
  </defs>
</svg>